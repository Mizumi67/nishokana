<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NishoKana - SYSTEM UPDATE</title>
    <style>
        /* Setup Dasar Cyberpunk */
        @import url('https://googleapis.com');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a12;
            color: #00fedc;
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efek Garis TV Jadul / Scanlines */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 3px solid #ff0055;
            background: rgba(10, 10, 18, 0.9);
            box-shadow: 0 0 20px #ff0055, inset 0 0 20px #ff0055;
            position: relative;
            max-width: 600px;
            width: 90%;
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%); /* Potongan Sudut Cyberpunk */
        }

        /* Animasi Glitch Teks Utama */
        .glitch {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            color: #fff;
            text-shadow: 0 0 10px #00fedc;
            letter-spacing: 3px;
            margin-bottom: 20px;
            animation: blink 2s infinite;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a12;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff0055;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fedc, 0 2px #ff0055;
            clip: rect(85px, 450px, 140px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        /* Teks Deskripsi */
        .sub-text {
            color: #00fedc;
            font-size: 1.1rem;
            line-height: 1.8;
            text-shadow: 0 0 5px rgba(0, 254, 220, 0.5);
        }

        /* Animasi Loading Bar Cyberpunk */
        .loader-bar {
            width: 80%;
            height: 8px;
            background: #111;
            margin: 30px auto 10px auto;
            position: relative;
            border: 1px solid #00fedc;
            overflow: hidden;
        }

        .loader-fill {
            height: 100%;
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            width: 0%;
            animation: load 3s infinite ease-in-out;
        }

        .status-code {
            font-size: 0.8rem;
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* KEYFRAMES ANIMASI LOOPING */
        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 66px, 0); }
            10% { clip: rect(34px, 9999px, 55px, 0); }
            20% { clip: rect(81px, 9999px, 100px, 0); }
            30% { clip: rect(12px, 9999px, 85px, 0); }
            40% { clip: rect(63px, 9999px, 14px, 0); }
            50% { clip: rect(77px, 9999px, 95px, 0); }
            60% { clip: rect(2px, 9999px, 40px, 0); }
            70% { clip: rect(110px, 9999px, 125px, 0); }
            80% { clip: rect(56px, 9999px, 80px, 0); }
            90% { clip: rect(92px, 9999px, 115px, 0); }
            100% { clip: rect(5px, 9999px, 30px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            11% { clip: rect(12px, 9999px, 45px, 0); }
            25% { clip: rect(88px, 9999px, 120px, 0); }
            42% { clip: rect(5px, 9999px, 35px, 0); }
            57% { clip: rect(99px, 9999px, 150px, 0); }
            74% { clip: rect(33px, 9999px, 75px, 0); }
            90% { clip: rect(140px, 9999px, 170px, 0); }
            100% { clip: rect(20px, 9999px, 60px, 0); }
        }

        @keyframes load {
            0% { width: 0%; left: 0; }
            50% { width: 100%; left: 0; }
            100% { width: 0%; left: 100%; }
        }

        @keyframes blink {
            0%, 49%, 55%, 100% { opacity: 1; }
            50%, 54% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pastikan data-text sama dengan isi teks di dalam tag agar efek glitch rapi -->
        <h1 class="glitch" data-text="システム再構築中...">システム再構築中...</h1>
        
        <p class="sub-text">
            次世代の <strong>NishoKana</strong> へ進化中。<br>
            大幅なアップデートのため、現在システムを停止しています。しばらくお待ちください。
        </p>

        <!-- Animasi Loading Loop -->
        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>

        <div class="status-code">STATUS: CORE_EVOLUTION_IN_PROGRESS // VER 2.0</div>
    </div>

</body>
</html>
