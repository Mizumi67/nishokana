<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NishoKana - 新しい時代へ</title>
    <style>
        /* Mengambil font bernuansa kuas Jepang tradisional */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            /* Latar belakang gelap mistis dengan semburat merah di tengah */
            background: radial-gradient(circle at center, #1a0808 0%, #0a0202 100%);
            color: #f5edd6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Wadah untuk animasi kelopak sakura */
        .sakura-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Struktur bentuk kelopak bunga */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff99ad);
            border-radius: 150% 0 150% 150%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Jalur animasi guguran sakura dari atas ke bawah */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(120px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Efek cahaya lingkaran matahari terbit Jepang */
        .sun-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #bc002d 0%, #8a0022 100%);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.25;
            filter: blur(10px);
            animation: pulseSun 8s ease-in-out infinite alternate;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.15); opacity: 0.35; }
        }

        /* Kotak pengumuman utama */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(15, 5, 5, 0.8);
            padding: 3.5rem;
            border-radius: 4px;
            border: 1px solid rgba(188, 0, 45, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(188, 0, 45, 0.15);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }

        /* Ornamen sudut khas gerbang/arsitektur jepang */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #bc002d;
        }
        .container::before { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .container::after { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 0.4rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #bc002d;
            letter-spacing: 0.6rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Area pembungkus status teks */
        .status-box {
            border-top: 1px dashed rgba(245, 237, 214, 0.2);
            border-bottom: 1px dashed rgba(245, 237, 214, 0.2);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 2.2;
            color: #d4cbb3;
            margin-bottom: 0.5rem;
        }

        /* Efek lampu neon/bernafas pada tombol status */
        .status-badge {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.15rem;
            color: #ffcbd5;
            background: rgba(188, 0, 45, 0.25);
            padding: 0.5rem 1.5rem;
            border-radius: 2px;
            border: 1px solid rgba(188, 0, 45, 0.5);
            animation: breath 2.5s ease-in-out infinite;
        }

        @keyframes breath {
            0%, 100% { opacity: 0.7; box-shadow: 0 0 5px rgba(188,0,45,0.2); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(188,0,45,0.6); }
        }

        .version {
            font-size: 0.8rem;
            color: rgba(245, 237, 214, 0.4);
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>

    <!-- Komponen efek latar belakang bergoyang dan bersinar -->
    <div class="sun-bg"></div>
    <div class="sakura-container" id="sakura"></div>

    <!-- Konten Box Tengah -->
    <div class="container">
        <h1>NishoKana</h1>
        <div class="subtitle">システム再構築中</div>
        
        <div class="status-box">
            <p>次世代の NishoKana へ進化中。</p>
            <p>大幅なアップデートのため、現在システムを停止しています。</p>
            <p>しばらくお待ちください。</p>
        </div>

        <div class="status-badge">CORE EVOLUTION IN PROGRESS</div>
        <div class="version" style="margin-top: 1rem;">VER 2.0</div>
    </div>

    <!-- Script logika pemicu guguran kelopak bunga sakura secara berkala -->
    <script>
        function createSakura() {
            const container = document.getElementById('sakura');
            const maxPetals = 35; // Batas total kelopak bunga yang aktif di layar

            for (let i = 0; i < maxPetals; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                
                // Mengatur dimensi kelopak secara acak agar bervariasi
                let size = Math.random() * 10 + 7;
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.3}px`;
                
                // Posisi awal sebaran kelopak horizontal secara acak
                petal.style.left = `${Math.random() * 100}vw`;
                
                // Mengacak jeda masuk dan durasi jatuh agar menciptakan efek alami
                let duration = Math.random() * 5 + 6;
                let delay = Math.random() * -12;
                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `${delay}s`;

                container.appendChild(petal);
            }
        }
        // Jalankan fungsi setelah struktur dokumen selesai dimuat
        window.addEventListener('DOMContentLoaded', createSakura);
    </script>
</body>
</html>
