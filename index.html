<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <title>NishoKana - ドメイン移転のお知らせ</title>
    <style>
        /* Font bernuansa kuas Jepang tradisional */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            /* Latar belakang diubah menjadi MEDIUM GRAY agar tidak terlalu gelap gulita */
            background: radial-gradient(circle at center, #2e2424 0%, #1a1414 100%);
            color: #f5edd6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Wadah untuk animasi kelopak sakura */
        .sakura-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Struktur bentuk kelopak bunga */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff99ad);
            border-radius: 150% 0 150% 150%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* Jalur animasi guguran sakura dari atas ke bawah */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(120px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Efek cahaya lingkaran matahari terbit Jepang */
        .sun-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #bc002d 0%, #8a0022 100%);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.2;
            filter: blur(15px);
            animation: pulseSun 8s ease-in-out infinite alternate;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); opacity: 0.15; }
            100% { transform: scale(1.1); opacity: 0.28; }
        }

        /* Kotak pengumuman utama */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(35, 25, 25, 0.85); /* Diubah agar serasi dengan latar medium */
            padding: 3.5rem;
            border-radius: 6px;
            border: 1px solid rgba(188, 0, 45, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(188, 0, 45, 0.2);
            backdrop-filter: blur(10px);
            max-width: 650px;
            width: 90%;
        }

        /* Ornamen sudut khas arsitektur Jepang */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #bc002d;
        }
        .container::before { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .container::after { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 0.4rem;
            color: #ffffff;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #e63946;
            letter-spacing: 0.4rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Area pembungkus status teks */
        .status-box {
            border-top: 1px dashed rgba(245, 237, 214, 0.3);
            border-bottom: 1px dashed rgba(245, 237, 214, 0.3);
            padding: 1.8rem 0;
            margin-bottom: 2rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 2.2;
            color: #f5edd6;
            margin-bottom: 0.5rem;
        }

        .old-domain {
            text-decoration: line-through;
            color: #a09885;
            font-family: monospace;
        }

        /* Tombol Link Domain Baru dengan Animasi Berdenyut */
        .new-link {
            display: inline-block;
            margin-top: 1rem;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.1rem;
            color: #ffffff;
            background: linear-gradient(135deg, #bc002d, #e63946);
            padding: 0.8rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(188, 0, 45, 0.4);
            transition: all 0.3s ease;
            animation: pulseButton 2s infinite;
        }

        .new-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(230, 57, 70, 0.7);
            background: linear-gradient(135deg, #e63946, #ff4d6d);
        }

        @keyframes pulseButton {
            0% { box-shadow: 0 0 0 0 rgba(188, 0, 45, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(188, 0, 45, 0); }
            100% { box-shadow: 0 0 0 0 rgba(188, 0, 45, 0); }
        }

        .progress-text {
            font-size: 0.85rem;
            color: #ffcbd5;
            margin-top: 1.5rem;
            letter-spacing: 0.1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Komponen efek latar belakang bergoyang dan bersinar -->
    <div class="sun-bg"></div>
    <div class="sakura-container" id="sakura"></div>

    <!-- Konten Box Tengah -->
    <div class="container">
        <h1>NishoKana</h1>
        <div class="subtitle">公式サイト移転のお知らせ</div>
        
        <div class="status-box">
            <p>当ウェブサイトは <span class="old-domain" style="text-decoration: none;">github.io</span> ドメインでの運用を終了いたしました。</p>
            <p>新しい公式サイトは、下記の新しいドメインへと移行いたしました。</p>
            <p style="margin-top: 1rem; font-weight: 600;">下記のリンクをクリックして新しいサイトへお越しください：</p>
            
            <!-- Link menuju domain baru (Sudah ganti teks & otomatis buka di tab baru) -->
<a href="https://nishokana.my.id" class="new-link" target="_blank" style="display: inline-block; position: relative; z-index: 9999; cursor: pointer;">NishoKana</a>

        </div>
    

    <!-- Script logika pemicu guguran kelopak bunga sakura secara berkala -->
    <script>
        function createSakura() {
            const container = document.getElementById('sakura');
            const maxPetals = 35; // Batas total kelopak bunga yang aktif di layar

            for (let i = 0; i < maxPetals; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                
                // Mengatur dimensi kelopak secara acak agar bervariasi
                let size = Math.random() * 10 + 7;
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.3}px`;
                
                // Posisi awal sebaran kelopak horizontal secara acak
                petal.style.left = `${Math.random() * 100}vw`;
                
                // Mengacak jeda masuk dan durasi jatuh agar menciptakan efek alami
                let duration = Math.random() * 5 + 6;
                let delay = Math.random() * -12;
                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `${delay}s`;

                container.appendChild(petal);
            }
        }
        // Jalankan fungsi setelah struktur dokumen selesai dimuat
        window.addEventListener('DOMContentLoaded', createSakura);
    </script>
</body>
</html>
