<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NishoKana - ドメイン移転のお知らせ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/favicon-32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 30%, #4a2060 60%, #1a0a2e 100%);
            font-family: 'Noto Serif JP', 'Zen Kaku Gothic New', serif;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Wave pattern background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 183, 197, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 105, 180, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(200, 150, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Sakura petals */
        .sakura {
            position: fixed;
            top: -10%;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        .sakura-petal {
            width: 15px;
            height: 15px;
            background: radial-gradient(ellipse at 30% 30%, #ffb7c5, #ff69b4);
            border-radius: 50% 0 50% 50%;
            opacity: 0.8;
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(255, 183, 197, 0.3);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-30px) translateX(20px); opacity: 0.6; }
            50% { transform: translateY(-10px) translateX(-20px); opacity: 0.4; }
            75% { transform: translateY(-40px) translateX(10px); opacity: 0.7; }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 183, 197, 0.2);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardGlow 4s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            from {
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1),
                    0 0 30px rgba(255, 105, 180, 0.05);
            }
            to {
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1),
                    0 0 50px rgba(255, 105, 180, 0.15);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 183, 197, 0.03), transparent, rgba(200, 150, 255, 0.03), transparent);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        /* Japanese decorative element */
        .decoration {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: pulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Title */
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(255, 183, 197, 0.5);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 20px rgba(255, 183, 197, 0.3); }
            to { text-shadow: 0 0 30px rgba(255, 183, 197, 0.7); }
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 183, 197, 0.8);
            margin-bottom: 2rem;
            letter-spacing: 0.2em;
            font-weight: 400;
        }

        /* Divider */
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffb7c5, transparent);
            margin: 1.5rem auto;
            position: relative;
        }

        .divider::before {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffb7c5;
            font-size: 0.6rem;
            background: rgba(26, 10, 46, 0.8);
            padding: 0 10px;
        }

        /* Message */
        .message {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            line-height: 2;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .message p {
            margin-bottom: 0.8rem;
        }

        .highlight {
            color: #ffb7c5;
            font-weight: 700;
        }

        /* Button */
        .btn-container {
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(200, 150, 255, 0.2));
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Noto Serif JP', serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.4), rgba(200, 150, 255, 0.4));
            border-color: rgba(255, 183, 197, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }

        .btn-arrow {
            display: inline-block;
            margin-left: 8px;
            transition: transform 0.3s ease;
        }

        .btn:hover .btn-arrow {
            transform: translateX(5px);
        }

        /* Footer */
        .footer {
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .title {
                font-size: 1.4rem;
            }
            .message {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Sakura petals will be generated by JS -->
    
    <div class="container">
        <div class="card">
            <div class="card-content">
                <div class="decoration">⛩️</div>
                <h1 class="title">NishoKana</h1>
                <p class="subtitle">ドメイン移転のお知らせ</p>
                
                <div class="divider"></div>
                
                <div class="message">
                    <p>当ウェブサイトは <span class="highlight">github.io</span> ドメインでの運用を終了いたしました。</p>
                    <p>新しい公式サイトは、下記の新しいドメインへと移行いたしました。</p>
                    <p>下記のリンクをクリックして新しいサイトへお越しください。</p>
                </div>

                <div class="btn-container">
                    <a href="https://nishokana.my.id" class="btn">
                        新しいサイトへ
                        <span class="btn-arrow">→</span>
                    </a>
                </div>

                <div class="footer">
                    <p>© NishoKana — All Rights Reserved</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create sakura petals
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            
            const petal = document.createElement('div');
            petal.classList.add('sakura-petal');
            sakura.appendChild(petal);
            
            sakura.style.left = Math.random() * 100 + 'vw';
            sakura.style.animationDuration = (Math.random() * 5 + 8) + 's';
            sakura.style.animationDelay = Math.random() * 5 + 's';
            sakura.style.opacity = Math.random() * 0.5 + 0.3;
            
            const size = Math.random() * 10 + 10;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            
            document.body.appendChild(sakura);
            
            setTimeout(() => {
                sakura.remove();
            }, 15000);
        }

        // Create floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = Math.random() * 100 + 'vh';
            particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
            particle.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(particle);
        }

        // Generate sakura petals periodically
        setInterval(createSakura, 800);
        
        // Generate initial particles
        for (let i = 0; i < 20; i++) {
            createParticle();
        }

        // Generate initial sakura
        for (let i = 0; i < 8; i++) {
            setTimeout(createSakura, i * 300);
        }
    </script>
</body>
</html>
